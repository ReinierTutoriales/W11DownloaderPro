[package]
name = "w11dl"
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
description = "Motor de descargas acelerado para Windows 11"
publish = false

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "sync", "net", "time", "process"] }
hyper = { version = "1.12", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.10", features = ["http2", "native-tokio"] }
http-body-util = { version = "0.1.5", features = ["channel"] }
bytes = "1"
rustls = "0.23.45"
sha2 = "0.11.0"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tower-service = "0.3"
scraper = "0.27"
url = "2.5"
robotstxt = "0.3"

[features]
# Ganchos solo para pruebas (barreras deterministas); no forman parte de ninguna compilación publicada.
test-hooks = []

[dev-dependencies]
w11dl = { path = ".", features = ["test-hooks"] }
hyper = { version = "1.12", features = ["server"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
